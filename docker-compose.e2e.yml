services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vdb
      POSTGRES_USER: vdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdb -d vdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/village-des-benjamins"]
    networks:
      - e2e
    profiles:
      - init
  mailpit:
    image: axllent/mailpit
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - e2e
networks:
  e2e:
    driver: bridge
